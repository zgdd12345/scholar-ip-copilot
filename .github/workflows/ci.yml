name: ci

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  release-gates:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Create project environment
        run: python -m venv .venv
      - name: Install development dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]" build

      - name: Ruff
        run: .venv/bin/python -m ruff check src packages tests
      - name: Full pytest suite
        run: .venv/bin/python -m pytest tests/ -v

      - name: Checkout has no project-skill ownership state
        run: test ! -e .agents/skills/.evidraft-ownership.json
      - name: Tracked release package has no drift
        run: .venv/bin/python -m evidraft.cli package --plugin plugins/scholar-ip --out plugins/scholar --check
      - name: Marketplace and tracked-package contracts
        run: |
          test -f .agents/plugins/marketplace.json
          test -f .claude-plugin/marketplace.json
          test -f plugins/scholar/.codex-plugin/plugin.json
          test -f plugins/scholar/.claude-plugin/plugin.json
          .venv/bin/python -m pytest tests/test_v3_shared_contracts.py::test_repo_marketplaces_point_to_tracked_scholar_package tests/test_release_package.py::test_tracked_release_package_has_no_drift -q
      - name: Portable Codex manifest contract
        run: .venv/bin/python -m pytest tests/test_release_package.py::test_portable_codex_manifest_contract -q

      - name: Install official Claude Code validator
        run: npm install --global @anthropic-ai/claude-code
      - name: Official plugin validator
        run: claude plugin validate plugins/scholar

      - name: Temporary OpenCode inventory
        shell: bash
        run: |
          root=$(mktemp -d)
          trap 'rm -rf "$root"' EXIT
          .venv/bin/evidraft-opencode --plugin plugins/scholar-ip --out "$root/opencode"
          ROOT="$root" .venv/bin/python -c 'import os,pathlib; r=pathlib.Path(os.environ["ROOT"])/"opencode"; assert len(list((r/"commands").glob("scholar-*.md"))) == 7; assert (r/"private/policies/policy.yaml").is_file(); assert (r/"private/capabilities/index.yaml").is_file()'

      - name: Build wheel
        shell: bash
        run: |
          unset PYTHONPATH
          export PYTHONDONTWRITEBYTECODE=1
          repo_python="$GITHUB_WORKSPACE/.venv/bin/python"
          cd "$RUNNER_TEMP"
          "$repo_python" -c 'import sys; from pathlib import Path; from evidraft.release import stage_wheel_source; stage_wheel_source(Path(sys.argv[1]), Path(sys.argv[2]))' "$GITHUB_WORKSPACE" "$RUNNER_TEMP/source"
          "$repo_python" -m build --wheel --outdir "$RUNNER_TEMP/dist" "$RUNNER_TEMP/source"
          "$repo_python" -c 'import pathlib,sys,zipfile; p=next(pathlib.Path(sys.argv[1]).glob("*.whl")); n=set(zipfile.ZipFile(p).namelist()); required={"evidraft/schemas/workflow.schema.json"}; forbidden={"packages/adapters/_shared/loader.py","packages/adapters/_shared/bundle.py","packages/core/src/__init__.py","packages/core/src/migrate.py"}; prefixes=("plugins/",".codex-plugin/",".claude-plugin/","skills/"); leaked=sorted(x for x in n if x.startswith(prefixes)); assert required <= n, required-n; assert not forbidden & n, forbidden & n; assert not leaked, leaked' "$RUNNER_TEMP/dist"
      - name: Clean-install wheel and smoke all console scripts outside repository
        shell: bash
        run: |
          unset PYTHONPATH
          export PYTHONDONTWRITEBYTECODE=1
          cd "$RUNNER_TEMP"
          python -m venv "$RUNNER_TEMP/evidraft-smoke"
          "$RUNNER_TEMP/evidraft-smoke/bin/python" -m pip install "$RUNNER_TEMP"/dist/*.whl
          "$RUNNER_TEMP/evidraft-smoke/bin/evidraft" --help
          "$RUNNER_TEMP/evidraft-smoke/bin/evidraft-claude-code" --help
          "$RUNNER_TEMP/evidraft-smoke/bin/evidraft-codex-cli" --help
          "$RUNNER_TEMP/evidraft-smoke/bin/evidraft-opencode" --help
          cp -R "$GITHUB_WORKSPACE/plugins/scholar-ip" "$RUNNER_TEMP/scholar-ip"
          "$RUNNER_TEMP/evidraft-smoke/bin/evidraft-claude-code" --plugin "$RUNNER_TEMP/scholar-ip" --out "$RUNNER_TEMP/claude"
          "$RUNNER_TEMP/evidraft-smoke/bin/evidraft-codex-cli" --plugin "$RUNNER_TEMP/scholar-ip" --out "$RUNNER_TEMP/codex"
          "$RUNNER_TEMP/evidraft-smoke/bin/evidraft-opencode" --plugin "$RUNNER_TEMP/scholar-ip" --out "$RUNNER_TEMP/opencode"
          "$RUNNER_TEMP/evidraft-smoke/bin/python" -c 'import os,pathlib; r=pathlib.Path(os.environ["RUNNER_TEMP"]); assert len(list((r/"claude/commands").glob("*.md"))) == 7; assert len(list((r/"codex/skills").glob("scholar-*/SKILL.md"))) == 7; assert len(list((r/"opencode/commands").glob("scholar-*.md"))) == 7'

      - name: Release checks leave the checkout unchanged
        run: git diff --exit-code
